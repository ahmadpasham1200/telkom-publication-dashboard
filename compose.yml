services:
  postgres:
    image: postgres:16
    container_name: pubdash_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/ddl:/docker-entrypoint-initdb.d

  # superset, prefect-server, dan etl-worker ditambahkan di tahap berikutnya,
  # setelah skema database (raw/staging/core/mart) stabil.

volumes:
  pg_data: